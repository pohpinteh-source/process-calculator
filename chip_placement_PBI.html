<!DOCTYPE html>
<html>
<head>
<title>Chip Placement (PBI)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
}

h1{
    text-align:center;
    background:orange;
    padding:12px;
}

table{
    width:100%;
    border-collapse:collapse;
}

td{
    border:1px solid black;
    padding:8px;
    text-align:center;
}

.label{
    background:#d9d9d9;
}

.input-box{
    background:yellow;
}

.result-box{
    background:#00ff00;
    font-weight:bold;
}

input{
    width:100%;
    border:none;
    background:yellow;
    text-align:center;
}

button{
    width:100%;
    padding:10px;
    margin-top:6px;
}

img{
    width:260px;
    display:block;
    margin:20px auto;
}
</style>
</head>

<body onload="setFocus()">

<h1>Chip Placement (PBI)</h1>

<p style="color:red;">** Key in Yellow box.</p>
<img src="Chip Placement PBI.png">

<table>

<tr>
<td class="label">Existing Offset Value in m/c</td>
<td>X</td>
<td class="input-box"><input id="offsetX"></td>
<td>µm</td>

<td>Y</td>
<td class="input-box"><input id="offsetY"></td>
<td>µm</td>
</tr>

<tr>
<td class="label">Post Bond Inspection (PBI), ±5µm</td>
<td>X (PBI)</td>
<td class="input-box"><input id="pbiX"></td>
<td>µm</td>

<td>Y (PBI)</td>
<td class="input-box"><input id="pbiY"></td>
<td>µm</td>
</tr>

<tr>
<td class="label">Placement offset need to adjust</td>
<td colspan="3" class="result-box" id="adjustX"></td>
<td colspan="3" class="result-box" id="adjustY"></td>
</tr>

<tr>
<td class="label">New Offset Value in m/c</td>
<td colspan="3" class="result-box" id="newX"></td>
<td colspan="3" class="result-box" id="newY"></td>
</tr>

</table>

<button onclick="clearData()">Clear</button>
<button onclick="goBack()">Back</button>

<script>

// focus
function setFocus(){
    offsetX.focus();
}


// ✅ smart clear + restore
let backup = {};

document.querySelectorAll("input").forEach(el=>{

    const id = el.id;

    // clear when click, but remember old value
    el.addEventListener("focus",function(){

        backup[id] = this.value;

        if(this.value !== ""){
            this.value = "";
        }
    });

    // restore if no new value entered
    el.addEventListener("blur",function(){

        if(this.value === ""){
            this.value = backup[id] || "";
        }
    });
});

// calculation
function calculate(){

    let offsetXVal = Number(offsetX.value) || 0;
    let offsetYVal = Number(offsetY.value) || 0;

    // X Direction
    if(pbiX.value !== ""){

        let x = Number(pbiX.value);

        if(x === 0){
            adjustX.innerHTML = "No adjustment needed";
        }
        else if(x < 0){
            adjustX.innerHTML =
                "Shift Right with additional →, +" +
                Math.abs(x) + " µm";
        }
        else{
            adjustX.innerHTML =
                "Shift Left with additional ←, -" +
                x + " µm";
        }

        let newXVal = offsetXVal - x;

        newX.innerHTML = newXVal.toFixed(1) + " µm";
    }
    else{
        adjustX.innerHTML = "";
        newX.innerHTML = "";
    }

    // Y Direction
    if(pbiY.value !== ""){

        let y = Number(pbiY.value);

        if(y === 0){
            adjustY.innerHTML = "No adjustment needed";
        }
        else if(y < 0){
            adjustY.innerHTML =
                "Shift Up with additional ↑, +" +
                Math.abs(y) + " µm";
        }
        else{
            adjustY.innerHTML =
                "Shift Down with additional ↓, -" +
                y + " µm";
        }

        let newYVal = offsetYVal - y;

        newY.innerHTML = newYVal.toFixed(1) + " µm";
    }
    else{
        adjustY.innerHTML = "";
        newY.innerHTML = "";
    }
}

// auto calculate
["offsetX","offsetY","pbiX","pbiY"].forEach(id=>{
    document.getElementById(id).addEventListener("input",calculate);
});

// enter key flow
const flow = ["offsetX","offsetY","pbiX","pbiY"];

flow.forEach((id,i)=>{
    document.getElementById(id).addEventListener("keydown",function(e){

        if(e.key==="Enter"){
            e.preventDefault();

            if(i + 1 < flow.length){
                document.getElementById(flow[i+1]).focus();
            }
        }
    });
});

// clear
function clearData(){
    document.querySelectorAll("input").forEach(i=>i.value="");
    document.querySelectorAll(".result-box").forEach(i=>i.innerHTML="");
    setFocus();
}

// back
function goBack(){
    window.location.href="index.html";
}

</script>

</body>
</html>
