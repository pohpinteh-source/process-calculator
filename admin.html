
<!DOCTYPE html>

<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Management</title>
<style>

@media (max-width: 600px){

    body{
        margin:10px;
    }

    h1{
        font-size:22px;
    }

    h2{
        font-size:18px;
    }

    input,
    textarea{
        font-size:16px;
    }

    #userList{
        height:400px;
    }

    .button-row,
    div[style*="display:flex"]{
        flex-direction:column;
    }

    button{
        width:100%;
    }
}

body{
    font-family:Arial, sans-serif;
    background:#dfe6ed;
    margin:20px;
}

.top-bar{
    text-align:center;
    margin-bottom:25px;
}

.top-bar h1{
    color:#1f4e79;
    margin-top:10px;
}

.back-btn{
    background:#1f4e79;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:auto;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:
    0 4px 10px rgba(0,0,0,0.15);
}

.card h2{
    color:#1f4e79;
    margin-top:0;
}

#userList{
    max-height:350px;
    overflow-y:auto;
}

input{
    width:90%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:10px;
    border:1px solid #ccc;
}

textarea{
    width:90%;
    border-radius:10px;
    padding:10px;
}

.button-row{
    margin-top:15px;
    display:flex;
    gap:10px;
}


button{
    background:#1f4e79;
    color:white;
    border:none;
    padding:12px;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
    min-height:44px;
}


button:hover{
    background:#2d6dad;
}

</style>

</head>

<body>


<div style="
background:#1f4e79;
color:white;
padding:15px;
border-radius:15px;
text-align:center;
margin-bottom:20px;
">

<h1 style="margin:0;">
🔒 User Access Management
</h1>

<p style="margin-top:8px;">
Process Calculator Administration Panel
</p>

</div>

<h2>Register New User</h2>

<label>Email Address</label>


<input
id="email"
type="email"
placeholder="Enter Email Address"
style="width:90%;">


<button onclick="addUser()">
        ➕ Register New User
    </button>


<hr>

<h2>Generated Link</h2>

<textarea
id="linkBox"
rows="3"
style="width:90%;"></textarea>
<br>


<div style="
    display:flex;
    gap:10px;
    margin-top:10px;
    flex-wrap:wrap;
">



<button onclick="copyLink()">
        📋 Copy Link
    </button>

<button onclick="clearForm()">
    🗑 Next Register
</button>


<button onclick="goHome()">
⬅ Back to Process Calculator
</button>



</div>
<h2>Registered Users</h2>

<div style="
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
">

<h3 id="userCount"></h3>


    <button onclick="exportUsers()"
        style="
        min-width:150px;
        ">
        📊 Export Users
    </button>

</div>


<div id="userList"
     style="
        border:1px solid #ccc;
        height:300px;
        overflow-y:auto;
        padding:10px;
        background:#f8f8f8;">
</div>
<hr>


<script src="users.js"></script>
<script src="admin.js"></script>


</body>
</html>
