<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>
Usage Statistics Dashboard
</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    margin:10px;
}

.title{
    background:#1f4e79;
    color:white;
    text-align:center;
    padding:15px;
    font-size:28px;
    font-weight:bold;
    border-radius:8px;
    margin-bottom:15px;
}

.filter-bar{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:15px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

button{
    padding:10px;
    min-width:140px;
    margin:5px;
    cursor:pointer;
}

.card{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

h3{
    margin-top:0;
    color:#1f4e79;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:yellow;
}

th,td{
    border:1px solid #ccc;
    padding:6px;
}

#logTable{
    max-height:400px;
    overflow:auto;
}

</style>

</head>

<body>

<div class="title">
📊 Usage Statistics Dashboard
</div>

<div class="filter-bar">

<button onclick="loadAll()">
All Data
</button>

<button onclick="loadLast7Days()">
Last 7 Days
</button>

<button onclick="loadLast30Days()">
Last 30 Days
</button>

<button onclick="refreshData()">
🔄 Refresh
</button>

<button onclick="goHome()">
⬅ Back
</button>

</div>

<div class="card">

<h3>
Calculator Usage Ranking
</h3>

<canvas id="calculatorChart"></canvas>

</div>

<div class="card">

<h3>
Top Users Usage
</h3>

<canvas id="userChart"></canvas>

</div>

<div class="card">

<h3>
Access Log
</h3>

<div id="logTable">

<table>

<thead>
<tr>
<th>Timestamp</th>
<th>User</th>
<th>Calculator</th>
</tr>
</thead>

<tbody id="logBody">
</tbody>

</table>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyX8XQZ924Ut6OSBfCDOsoQ_X_9-DNqjhg7_5H6wKlVjRvZPC8mwucyA-mfmxOuXzwG/exec";

let allLogs = [];

let calculatorChart = null;
let userChart = null;

function trackUsage(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const user =
        params.get("user");

    if(!user){
        return;
    }

    fetch(
        API_URL +
        "?action=trackUsage" +
        "&user=" +
        encodeURIComponent(user) +
        "&calculator=usage_statistics_dashboard"
    );
}

async function loadLogs(){

    try{

        const response =
            await fetch(
                API_URL +
                "?action=getAccessLog"
            );

        allLogs =
            await response.json();

        buildDashboard(
            allLogs
        );

    }
    catch(err){

        console.error(err);

        alert(
            "Unable to load Access Log.\n\n" +
            err.message
        );
    }
}

async function refreshData(){

    try{

        const response =
            await fetch(
                API_URL +
                "?action=getAccessLog"
            );

        allLogs =
            await response.json();

        buildDashboard(
            allLogs
        );

    }
    catch(err){

        console.error(err);

        alert(
            "Refresh failed.\n\n" +
            err.message
        );
    }
}

function buildDashboard(logs){

    buildCalculatorChart(logs);

    buildUserChart(logs);

    buildLogTable(logs);
}

function buildCalculatorChart(logs){

    const counter = {};

    logs.forEach(log=>{

        if(
            !log.calculator ||
            log.calculator.trim() === "" ||
            log.calculator === "usage_statistics_dashboard"
        ){
            return;
        }

        const name =
            decodeURIComponent(
                log.calculator
            );

        counter[name] =
            (counter[name] || 0) + 1;

    });

    const labels =
        Object.keys(counter);

    const values =
        Object.values(counter);

    if(calculatorChart){
        calculatorChart.destroy();
    }

    calculatorChart =
        new Chart(

            document.getElementById(
                "calculatorChart"
            ),

            {

                type:"bar",

                data:{

                    labels:labels,

                    datasets:[{

                        label:"Usage Count",

                        data:values,

                        backgroundColor:
                        "#1f4e79"

                    }]
                }
            }

        );
}

function buildUserChart(logs){

    const counter = {};

    logs.forEach(log=>{

        if(
            !log.calculator ||
            log.calculator.trim() === "" ||
            log.calculator === "usage_statistics_dashboard"
        ){
            return;
        }

        counter[log.user] =
            (counter[log.user] || 0) + 1;

    });

    const labels =
        Object.keys(counter);

    const values =
        Object.values(counter);

    if(userChart){
        userChart.destroy();
    }

    userChart =
        new Chart(

            document.getElementById(
                "userChart"
            ),

            {

                type:"bar",

                data:{

                    labels:labels,

                    datasets:[{

                        label:"Usage Count",

                        data:values,

                        backgroundColor:
                        "#ff9800"

                    }]
                },

                options:{

                    indexAxis:"y"

                }

            }

        );
}

function formatTimestamp(timestamp){

    const d =
        new Date(timestamp);

    const yyyy =
        d.getFullYear();

    const mm =
        String(
            d.getMonth()+1
        ).padStart(2,"0");

    const dd =
        String(
            d.getDate()
        ).padStart(2,"0");

    const hh =
        String(
            d.getHours()
        ).padStart(2,"0");

    const min =
        String(
            d.getMinutes()
        ).padStart(2,"0");

    const ss =
        String(
            d.getSeconds()
        ).padStart(2,"0");

    return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
}

function buildLogTable(logs){

    let html = "";

    logs
    .slice()
    .reverse()
    .forEach(log=>{

        html +=

        `
        <tr>

            <td>
                ${formatTimestamp(log.timestamp)}
            </td>

            <td>
                ${log.user}
            </td>

            <td>
                ${
                    log.calculator
                    ?
                    decodeURIComponent(
                        log.calculator
                    )
                    :
                    "-"
                }
            </td>

        </tr>
        `;
    });

    document.getElementById(
        "logBody"
    ).innerHTML = html;
}

function daysFilter(days){

    const cutoff =
        new Date();

    cutoff.setDate(
        cutoff.getDate() - days
    );

    return allLogs.filter(log=>{

        return new Date(
            log.timestamp
        ) >= cutoff;

    });
}

function loadLast7Days(){

    buildDashboard(
        daysFilter(7)
    );
}

function loadLast30Days(){

    buildDashboard(
        daysFilter(30)
    );
}

function loadAll(){

    buildDashboard(
        allLogs
    );
}

function goHome(){

    window.location.href =
        "index.html" +
        window.location.search;
}

trackUsage();

loadLogs();

</script>

</body>

</html>
