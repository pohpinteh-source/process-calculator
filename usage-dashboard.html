<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>
Usage Statistics Dashboard
</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    margin:10px;
}

.title{
    background:#1f4e79;
    color:white;
    text-align:center;
    padding:15px;
    font-size:28px;
    font-weight:bold;
    border-radius:8px;
    margin-bottom:15px;
}

.filter-bar{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:15px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

button{
    padding:10px;
    min-width:140px;
    margin:5px;
    cursor:pointer;
}
select{
    padding:10px;
    min-width:160px;
    margin:5px;
    cursor:pointer;
    height:42px;
}
.card{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

h3{
    margin-top:0;
    color:#1f4e79;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:yellow;
}

th,td{
    border:1px solid #ccc;
    padding:6px;
}

#logTable{
    max-height:400px;
    overflow:auto;
}

</style>

</head>

<body>

<div class="title">

📊 Usage Statistics Dashboard

</div>

<div class="filter-bar">

<button onclick="loadAll()">
All Data
</button>

<button onclick="loadLast7Days()">
Last 7 Days
</button>

<button onclick="loadLast30Days()">
Last 30 Days
</button>

<select id="periodFilter" onchange="filterByPeriod()">
    <option value="">📅 Select Month/Year</option>
</select>


<button onclick="refreshData()">
🔄 Refresh
</button>

<button onclick="goHome()">
⬅ Back
</button>

</div>
<div class="card">

<h3>
Calculator Usage Ranking
</h3>

<canvas id="calculatorChart"></canvas>

</div>

<div class="card">

<h3>
Top Users Usage
</h3>

<canvas id="userChart"></canvas>

</div>

<div class="card">

<h3>
Access Log
</h3>

<div id="logTable">

<table>

<thead>

<tr>
<th>Timestamp</th>
<th>User</th>
<th>Calculator</th>
</tr>

</thead>

<tbody id="logBody">

</tbody>

</table>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyX8XQZ924Ut6OSBfCDOsoQ_X_9-DNqjhg7_5H6wKlVjRvZPC8mwucyA-mfmxOuXzwG/exec";

let allLogs = [];

let calculatorChart = null;
let userChart = null;

function trackUsage(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const user =
        params.get("user");

    if(!user){
        return;
    }

    fetch(
        API_URL +
        "?action=trackUsage" +
        "&user=" +
        encodeURIComponent(user) +
        "&calculator=usage_statistics_dashboard"
    );
}

async function loadLogs(){
    try{
        const response =
            await fetch(
                API_URL +
                "?action=getAccessLog"
            );

        allLogs =
            await response.json();

        populateFilters();

        buildDashboard(
            allLogs
        );
    }

    catch(err){

        console.error(err);

        alert(
            "Unable to load Access Log.\n\n" +
            err.message
        );
    }
}

function buildDashboard(logs){

    buildCalculatorChart(logs);

    buildUserChart(logs);

    buildLogTable(logs);
}

function buildCalculatorChart(logs){

    const counter = {};

    logs.forEach(log=>{

        if(
            !log.calculator ||
            log.calculator.trim() === "" ||
            log.calculator === "usage_statistics_dashboard"
        ){
            return;
        }

        const name =
            decodeURIComponent(
                log.calculator
            );

        counter[name] =
            (counter[name] || 0) + 1;

    });

const sortedData =
    Object.entries(counter)
    .sort((a, b) => b[1] - a[1]);

const labels =
    sortedData.map(item => item[0]);

const values =
    sortedData.map(item => item[1]);


    if(calculatorChart){

        calculatorChart.destroy();

    }

    calculatorChart =
        new Chart(

            document.getElementById(
                "calculatorChart"
            ),

            {

                type:"bar",

                data:{

                    labels:labels,

                    datasets:[{

                        label:"Usage Count",

                        data:values,

                        backgroundColor:"#1f4e79"

                    }]

                },

                options:{

                    responsive:true,

                    scales:{

                        y:{

                            beginAtZero:true,

                            min:0,

                            ticks:{

                                stepSize:1,

                                callback:function(value){

                                    return Number.isInteger(value)
                                        ? value
                                        : null;

                                }

                            }

                        }

                    }

                }

            }

        );
}
function buildUserChart(logs){

    const counter = {};

    logs.forEach(log=>{

        if(
            !log.calculator ||
            log.calculator.trim() === "" ||
            log.calculator === "usage_statistics_dashboard"
        ){
            return;
        }

        const userName =
            log.user.split("@")[0];

        counter[userName] =
            (counter[userName] || 0) + 1;

    });

const sortedData =
    Object.entries(counter)
    .sort((a, b) => b[1] - a[1]);

const labels =
    sortedData.map(item => item[0]);

const values =
    sortedData.map(item => item[1]);
    if(userChart){

        userChart.destroy();

    }

    userChart =
        new Chart(

            document.getElementById(
                "userChart"
            ),

            {

                type:"bar",

                data:{

                    labels:labels,

                    datasets:[{

                        label:"Usage Count",

                        data:values,

                        backgroundColor:"#ff9800"

                    }]

                },

                options:{

                    responsive:true,

                    scales:{

                        y:{

                            beginAtZero:true,

                            ticks:{

                                stepSize:1,
                                precision:0

                            }

                        }

                    }

                }

            }

        );
}
function formatTimestamp(timestamp){

    const d = new Date(timestamp);

    const yyyy =
        d.getFullYear();

    const mm =
        String(
            d.getMonth() + 1
        ).padStart(2,"0");

    const dd =
        String(
            d.getDate()
        ).padStart(2,"0");

    const hh =
        String(
            d.getHours()
        ).padStart(2,"0");

    const min =
        String(
            d.getMinutes()
        ).padStart(2,"0");

    const ss =
        String(
            d.getSeconds()
        ).padStart(2,"0");

    return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
}
function buildLogTable(logs){

    let html = "";

    logs
    .slice()
    .reverse()
    .forEach(log=>{

        html +=
        `
        <tr>

<td>
    ${formatTimestamp(log.timestamp)}
</td>
            <td>
                ${log.user}
            </td>

<td>
    ${
        log.calculator
        ?
        decodeURIComponent(
            log.calculator
        )
        :
        "-"
    }
</td>
        </tr>
        `;
    });

    document.getElementById(
        "logBody"
    ).innerHTML = html;
}

function daysFilter(days){

    const cutoff =
        new Date();

    cutoff.setDate(
        cutoff.getDate() - days
    );

    return allLogs.filter(log=>{

        return new Date(
            log.timestamp
        ) >= cutoff;

    });
}

function loadLast7Days(){

    buildDashboard(
        daysFilter(7)
    );
}

function loadLast30Days(){

    buildDashboard(
        daysFilter(30)
    );
}

function loadAll(){

    buildDashboard(
        allLogs
    );
}

function populateFilters(){

    const periodFilter =
        document.getElementById("periodFilter");

    periodFilter.innerHTML =
        '<option value="">📅 Select Month/Year</option>';

    const periods = [];

    const uniquePeriods = new Set();

    allLogs.forEach(log => {

        const d = new Date(log.timestamp);

        const period =
            d.getFullYear() +
            "-" +
            String(d.getMonth() + 1)
            .padStart(2, "0");

        if(!uniquePeriods.has(period)){
            uniquePeriods.add(period);
            periods.push(period);
        }
    });

    periods
        .sort((a,b) => new Date(b) - new Date(a))
        .forEach(period => {

            const [year, month] =
                period.split("-");

            const monthName =
                new Date(year, month - 1, 1)
                .toLocaleString(
                    "en-US",
                    { month: "short" }
                );

            const option =
                document.createElement("option");

            option.value = period;

            option.textContent =
                `${monthName} ${year}`;

            periodFilter.appendChild(option);
        });
}
function filterByPeriod(){

    const selected =
        document.getElementById(
            "periodFilter"
        ).value;

    if(!selected){

        buildDashboard(allLogs);
        return;
    }

    const filtered =
        allLogs.filter(log => {

            const d =
                new Date(log.timestamp);

            const period =
                d.getFullYear() +
                "-" +
                String(d.getMonth() + 1)
                .padStart(2,"0");

            return period === selected;
        });

    buildDashboard(filtered);
}


function goHome(){

    window.location.href =
        "index.html" +
        window.location.search;
}

trackUsage();

loadLogs();

</script>

</body>

</html>
