<!DOCTYPE html>
<html>
<head>
<title>Process Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
    font-family: Arial;
    background: #f5f5f5;
    text-align: center;
    margin: 10px;
}

h1 {
    margin-top: 10px;
}

/* layout */
.container {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
    flex-wrap: wrap;
}

.column {
    width: 23%;
    min-width: 200px;
}

/* title */
.section-title {
    font-size: 18px;
    margin-bottom: 10px;
    font-weight: bold;
}

/* buttons */

button{
    display:block;
    width:95%;
    margin:6px auto;
    padding:10px;

    color:white;
    font-weight:bold;

    background:linear-gradient(
        to bottom,
        #1e90ff,
        #0057d8
    );

    border:none;
    border-radius:30px;

    transition:all 0.15s ease;
}

button:hover{
    transform:translateY(-2px);

    background:linear-gradient(
        to bottom,
        #4da3ff,
        #006eff
    );
}

button:active{
    transform:scale(0.97);

    background:linear-gradient(
        to bottom,
        #0057d8,
        #003c99
    );

    box-shadow:
    inset 0 2px 5px rgba(0,0,0,0.3);
}

/* mobile */
@media (max-width:600px){

.container {
    flex-direction: column;
    align-items: center;
}

.column {
    width: 90%;
}

button {
    font-size: 15px;
    padding: 12px;
}

}
.copyright{
    margin-top:20px;
    text-align:center;
    font-size:14px;
    color:#555;
}

.copyright img{
    width:60px;
    height:auto;
    margin-bottom:5px;
}
</style>

</head>
