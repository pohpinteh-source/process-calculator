<!DOCTYPE html>

<title>Process Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html,
body{
    font-family:Arial;
    background:#dfe6ed;
    text-align:center;
    margin:10px;
    min-height:95vh;
}

body{
    display:flex;
    flex-direction:column;
}

h1 {
    margin-top: 10px;
}

/* layout */
.container {
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-top:20px;
    flex-wrap:nowrap;
    gap:15px;
    flex:1;
}


.column {
    width: 18%;
    min-width: 170px;
}

/* title */

.section-title{
    background:#1f4e79;
    color:white;
    padding:8px;
    border-radius:20px;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}


/* buttons */

button{
    display:block;
    width:95%;
    margin:6px auto;
    padding:10px;

    color:black;
    font-weight:bold;

    background:linear-gradient(
        to bottom,
        #ffffff,
        #e6e6e6
    );

    border:1px solid #c0c0c0;
    border-radius:30px;

    box-shadow:
    0 3px 6px rgba(0,0,0,0.15);

    transition:all 0.15s ease;
}

button:hover{
    transform:translateY(-2px);

    background:linear-gradient(
        to bottom,
        #4da3ff,
        #006eff
    );
}

button:active{
    transform:scale(0.97);

    background:linear-gradient(
        to bottom,
        #0057d8,
        #003c99
    );

    box-shadow:
    inset 0 2px 5px rgba(0,0,0,0.3);
}

/* mobile */
@media (max-width:600px){

.container {
    flex-direction: column;
    align-items: center;
}

.column {
    width: 90%;
}

button {
    font-size: 15px;
    padding: 12px;
}

}

.copyright{
    width:100%;
    text-align:center;
    font-size:14px;
    color:#555;
    margin-top:auto;
    padding-top:20px;
}

.copyright img{
    width:60px;
    height:auto;
    margin-bottom:5px;
}

.disabled-btn{
    opacity:0.5;
    cursor:not-allowed;

    background:linear-gradient(
        to bottom,
        #f0f0f0,
        #cfcfcf
    );

    color:#666;
}

</style>

<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        // Get username from URL
        const params =
            new URLSearchParams(
                window.location.search
            );

        const user =
            params.get("user");

        if(user){

            const userName =
                user.split("@")[0];

            document.getElementById(
                "popupUserName"
            ).innerHTML =
                "👤 Welcome, " + userName;

        }

        const hide =
            localStorage.getItem(
                "hideQuickGuide"
            );

        if(hide !== "YES"){

            document.getElementById(
                "welcomeGuide"
            ).style.display = "block";

        }

    }
);
function closeWelcomeGuide(){

    if(
        document.getElementById(
            "dontShowAgain"
        ).checked
    ){

        localStorage.setItem(
            "hideQuickGuide",
            "YES"
        );

    }

    document.getElementById(
        "welcomeGuide"
    ).style.display = "none";

}

</script>
