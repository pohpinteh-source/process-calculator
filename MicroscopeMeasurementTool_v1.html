<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Microscope Measurement Tool</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:8px;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

h1{
    margin:0 0 10px 0;
}


.top-panel{
    display:flex;
    gap:20px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.control-box{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
}
button{
    padding:6px 12px;
    margin-bottom:8px;
    cursor:pointer;
    border:1px solid #ccc;
    border-radius:4px;
    background:white;
}

button:hover{
    background:#f0f0f0;
}
.workspace{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.panel{
    flex:1;
    min-width:450px;
    background:white;
    border-radius:10px;
    padding:8px;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

.drop-zone{
    border:2px dashed #888;
    border-radius:8px;
    padding:6px;
    text-align:center;
    background:#fafafa;
    cursor:pointer;
    margin-bottom:10px;
    color:#666;
}
.image-box{

    position:relative;

    border:2px dashed #999;

    height:500px;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    cursor:pointer;

}

.drop-text{

    position:absolute;

    color:#666;

    font-size:18px;

    text-align:center;

    pointer-events:none;

}

.image-box canvas{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

}
.drop-zone.dragover{
    background:#dff1ff;
    border-color:#0078d7;
}

canvas{
    border:1px solid #aaa;
    display:block;
    width:800px;
    height:600px;
    cursor:crosshair;
}


.result{
    font-size:14px;
    font-weight:bold;
    color:#0055aa;
    margin-bottom:3px;
}


input[type=number]{
    width:120px;
    padding:5px;
}

select{
    padding:5px;
}

button{

    padding:6px 12px;

    border:1px solid #d9534f;

    background:#d9534f;

    color:white;

    border-radius:4px;

    cursor:pointer;

}

button:hover{

    background:#c9302c;

}
.disabled-panel{
    border-color:red;
}

</style>
</head>

<body>

<h1>Microscope Measurement Tool</h1>

<div class="top-panel">

<div class="control-box">

Known Length

<input id="knownLength"
type="number"
placeholder="Enter calibration length"
step="0.001">

<select id="unit">
    <option value="um" selected>µm</option>
    <option value="mm">mm</option>
</select>



</div>

<div class="control-box">

Scale

<div id="scaleValue">
Not Calculated
</div>

</div>

</div>

<div class="workspace">

<!-- CALIBRATION -->

<div class="panel">

<h2>Calibration Image</h2>

<button id="clearCalibBtn">
Clear Calibration
</button>


<input
type="file"
id="calibFile"
accept="image/*"
hidden>


<div class="result">
Calibration Pixels:
<span id="calibPixels">0</span>
</div>

<div class="image-box" id="calibDrop">

    <div class="drop-text">
        Drop Calibration Image Here<br>
        or Click to Browse
    </div>

    <canvas
    id="calibCanvas"
    width="1200"
    height="800"></canvas>

</div>

</div>

<!-- MEASUREMENT -->

<div class="panel">

<h2>Measurement Image</h2>

<button id="lineBtn">Line</button>

<button id="circleBtn">Circle</button>

<button id="rectBtn">Rectangle</button>

<button id="polylineBtn">Polyline</button>


<button id="clearMeasureBtn">Clear Measurement</button>


<input
type="file"
id="measureFile"
accept="image/*"
hidden>

<div class="result">
Measured Pixels:
<span id="measurePixels">0</span>
</div>

<div class="result">
Actual Length:
<span id="actualLength">0</span>
</div>

<div class="image-box" id="measureDrop">

    <div class="drop-text">
        Drop Measurement Image Here<br>
        or Click to Browse
    </div>

    <canvas
    id="measureCanvas"
    width="1200"
    height="800"></canvas>

</div>
</div>

</div>

<script>

let scaleUmPerPixel = 0;

function drawImageFit(ctx, img, canvas){

    const scale = Math.min(
        canvas.width / img.width,
        canvas.height / img.height
    );

    const drawWidth = img.width * scale;
    const drawHeight = img.height * scale;

    const offsetX =
        (canvas.width - drawWidth) / 2;

    const offsetY =
        (canvas.height - drawHeight) / 2;

    ctx.drawImage(
        img,
        offsetX,
        offsetY,
        drawWidth,
        drawHeight
    );
}
function updateMeasurementState(){

    const panel =
        document.getElementById("measureDrop");

    const txt =
        document.querySelector(
            "#measureDrop .drop-text"
        );

    if(scaleUmPerPixel > 0){

        panel.classList.remove(
            "disabled-panel"
        );


    }
    else{

        panel.classList.add(
            "disabled-panel"
        );

        txt.style.display = "block";

        txt.innerHTML =
        "Complete Calibration First";

    }

}

function drawEllipse(ctx,x1,y1,x2,y2,color){

    const centerX = (x1+x2)/2;

    const centerY = (y1+y2)/2;

    const radiusX =
        Math.abs(x2-x1)/2;

    const radiusY =
        Math.abs(y2-y1)/2;

    ctx.beginPath();

    ctx.strokeStyle = color;

    ctx.lineWidth = 3;

    ctx.ellipse(
        centerX,
        centerY,
        radiusX,
        radiusY,
        0,
        0,
        Math.PI * 2
    );

    ctx.stroke();

}

function drawRectangle(
    ctx,
    x1,
    y1,
    x2,
    y2,
    color
){

    ctx.strokeStyle = color;

    ctx.lineWidth = 3;

    ctx.strokeRect(
        Math.min(x1,x2),
        Math.min(y1,y2),
        Math.abs(x2-x1),
        Math.abs(y2-y1)
    );

}

function drawArrow(ctx, x1, y1, x2, y2, color) {

    const headLength = 10;
    const angle = Math.atan2(y2 - y1, x2 - x1);

    ctx.strokeStyle = color;
    ctx.lineWidth = 3;

    // Main line
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    // Arrow at end
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(
        x2 - headLength * Math.cos(angle - Math.PI / 6),
        y2 - headLength * Math.sin(angle - Math.PI / 6)
    );
    ctx.moveTo(x2, y2);
    ctx.lineTo(
        x2 - headLength * Math.cos(angle + Math.PI / 6),
        y2 - headLength * Math.sin(angle + Math.PI / 6)
    );
    ctx.stroke();

    // Arrow at start
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(
        x1 + headLength * Math.cos(angle - Math.PI / 6),
        y1 + headLength * Math.sin(angle - Math.PI / 6)
    );
    ctx.moveTo(x1, y1);
    ctx.lineTo(
        x1 + headLength * Math.cos(angle + Math.PI / 6),
        y1 + headLength * Math.sin(angle + Math.PI / 6)
    );
    ctx.stroke();
}

function getCanvasPos(canvas, e){

    const rect = canvas.getBoundingClientRect();

    const scaleX =
        canvas.width / rect.width;

    const scaleY =
        canvas.height / rect.height;

    return {
        x:(e.clientX - rect.left) * scaleX,
        y:(e.clientY - rect.top) * scaleY
    };
}

/* =========================================
    CALIBRATION
========================================= */

const calibCanvas =
document.getElementById("calibCanvas");

const calibCtx =
calibCanvas.getContext("2d");

let calibImg = new Image();

let calibStart = null;
let calibEnd = null;

function loadCalibrationImage(file){

    const reader =
    new FileReader();

    reader.onload = function(e){

        calibImg.onload = function(){

            drawCalibration();

        };

        calibImg.src =
        e.target.result;
document.querySelector(
"#calibDrop .drop-text"
).style.display="none";
    };

    reader.readAsDataURL(file);
}

function drawCalibration(){

    calibCtx.clearRect(
        0,
        0,
        calibCanvas.width,
        calibCanvas.height
    );

    if(calibImg.src){

drawImageFit(
    calibCtx,
    calibImg,
    calibCanvas
);


    }

    if(calibStart && calibEnd){

drawArrow(
    calibCtx,
    calibStart.x,
    calibStart.y,
    calibEnd.x,
    calibEnd.y,
    "red"
);

        calculateScale();
    }
}

let calibDrawing = false;

calibCanvas.addEventListener("mousedown", function(e){

    const rect =
    calibCanvas.getBoundingClientRect();

calibStart =
getCanvasPos(calibCanvas,e);



    calibEnd = null;

    calibDrawing = true;

});

calibCanvas.addEventListener("mousemove", function(e){

    if(!calibDrawing) return;

calibEnd =
getCanvasPos(calibCanvas,e);


    drawCalibration();

});

calibCanvas.addEventListener("mouseup", function(e){

    calibEnd =
    getCanvasPos(calibCanvas,e);

    calibDrawing = false;

    drawCalibration();

});


function calculateScale(){

    if(!calibStart || !calibEnd)
    return;

    const pixels = Math.sqrt(
        Math.pow(
        calibEnd.x-calibStart.x,2)
        +
        Math.pow(
        calibEnd.y-calibStart.y,2)
    );

    document.getElementById(
    "calibPixels").innerText =
    pixels.toFixed(2);

let value = parseFloat(
document.getElementById("knownLength").value
);

if(isNaN(value) || value<=0){
    return;
}

let unit =
document.getElementById("unit").value;

let um = value;

if(unit==="mm"){
    um = value * 1000;
}

scaleUmPerPixel = um / pixels;

updateMeasurementState();

console.log(scaleUmPerPixel);



document.querySelector(
"#measureDrop .drop-text"
).style.display = "block";

document.querySelector(
"#measureDrop .drop-text"
).innerHTML =
"Drop Measurement Image Here<br>or Click to Browse";


const scaleText =
    scaleUmPerPixel.toFixed(6)
    + " µm/pixel";

document.getElementById(
    "scaleValue"
).innerText = scaleText;

}

document.getElementById(
"knownLength")
.addEventListener(
"input",
calculateScale);
document.getElementById(
"unit")
.addEventListener(
"change",
calculateScale);

/* =========================================
    MEASUREMENT
========================================= */

const measureCanvas =
document.getElementById(
"measureCanvas");

const measureCtx =
measureCanvas.getContext("2d");

let measureImg =
new Image();

let measureStart = null;
let measureEnd = null;

let measureMode = "select";

let shapes = [];

let selectedShape = null;

let draggingShape = false;

let dragOffsetX = 0;

let dragOffsetY = 0;

let currentShape = null;
let editMode = false;

function loadMeasureImage(file){
if(!isCalibrationReady()){
    return;
}
    const reader =
    new FileReader();

    reader.onload=function(e){

        measureImg.onload=
        drawMeasure;

        measureImg.src=
        e.target.result;
document.querySelector(
"#measureDrop .drop-text"
).style.display="none";


    };

    reader.readAsDataURL(file);
}

function drawMeasure(){

    measureCtx.clearRect(
        0,
        0,
        measureCanvas.width,
        measureCanvas.height
    );

    if(measureImg.src){

drawImageFit(
    measureCtx,
    measureImg,
    measureCanvas
);

    }
if(currentShape){

    if(currentShape.type==="circle"){

        drawEllipse(
            measureCtx,
            currentShape.x1,
            currentShape.y1,
            currentShape.x2,
            currentShape.y2,
            "yellow"
        );

    }

    if(currentShape.type==="rect"){

        drawRectangle(
            measureCtx,
            currentShape.x1,
            currentShape.y1,
            currentShape.x2,
            currentShape.y2,
            "yellow"
        );

    }

}
    if(measureStart && measureEnd){

if(measureMode === "line"){

    drawArrow(
        measureCtx,
        measureStart.x,
        measureStart.y,
        measureEnd.x,
        measureEnd.y,
        "#00cc00"
    );

}
else if(measureMode === "circle"){

    drawEllipse(
        measureCtx,
        measureStart.x,
        measureStart.y,
        measureEnd.x,
        measureEnd.y,
        "#00cc00"
    );

}
else if(measureMode === "rect"){

    drawRectangle(
        measureCtx,
        measureStart.x,
        measureStart.y,
        measureEnd.x,
        measureEnd.y,
        "#00cc00"
    );

}
        calculateMeasurement();
    }
}


let measureDrawing=false;

measureCanvas.addEventListener(
"mousedown",
function(e){
if(
    editMode &&
    currentShape
)
{

    const pos =
    getCanvasPos(measureCanvas,e);

    const minX =
    Math.min(
        currentShape.x1,
        currentShape.x2
    );

    const maxX =
    Math.max(
        currentShape.x1,
        currentShape.x2
    );

    const minY =
    Math.min(
        currentShape.y1,
        currentShape.y2
    );

    const maxY =
    Math.max(
        currentShape.y1,
        currentShape.y2
    );

    if(
        pos.x >= minX &&
        pos.x <= maxX &&
        pos.y >= minY &&
        pos.y <= maxY
    ){

        draggingShape=true;

        dragOffsetX=pos.x;

        dragOffsetY=pos.y;

        return;

    }

}
    if(!isCalibrationReady()){
        return;
    }

    measureStart=
    getCanvasPos(measureCanvas,e);

    measureEnd=null;

    measureDrawing=true;

}
);


// ADD THIS BLOCK HERE
measureCanvas.addEventListener(
"mousemove",
function(e){

    if(draggingShape && currentShape){

        const pos =
        getCanvasPos(measureCanvas,e);

        const dx =
        pos.x - dragOffsetX;

        const dy =
        pos.y - dragOffsetY;

        currentShape.x1 += dx;
        currentShape.x2 += dx;

        currentShape.y1 += dy;
        currentShape.y2 += dy;

        dragOffsetX = pos.x;
        dragOffsetY = pos.y;

        drawMeasure();

        return;
    }

    if(!measureDrawing) return;

    measureEnd =
    getCanvasPos(measureCanvas,e);

    drawMeasure();

}
);
measureCanvas.addEventListener(
"mouseup",
function(e){

    if(draggingShape){

        draggingShape = false;

        return;

    }

    measureEnd =
    getCanvasPos(measureCanvas,e);

    measureDrawing=false;

    if(
        measureMode==="circle" ||
        measureMode==="rect"
    ){

        currentShape = {

            type:measureMode,

            x1:measureStart.x,

            y1:measureStart.y,

            x2:measureEnd.x,

            y2:measureEnd.y

        };
measureStart = null;
measureEnd = null;
    }

    drawMeasure();

}
);

function isCalibrationReady(){

    if(!calibImg.src){
        alert("Please load Calibration Image first.");
        return false;
    }

    if(scaleUmPerPixel <= 0){
        alert("Please complete calibration first.");
        return false;
    }

    return true;
}

function calculateMeasurement(){

    if(scaleUmPerPixel===0){

        alert(
        "Please calibrate first."
        );

        return;
    }

let pixels;

if(measureMode==="line"){

    pixels = Math.sqrt(

        Math.pow(
            measureEnd.x-measureStart.x,
            2
        )

        +

        Math.pow(
            measureEnd.y-measureStart.y,
            2
        )

    );

}
else if(measureMode==="circle"){

    pixels =
        Math.abs(
            measureEnd.x-measureStart.x
        );

}
else if(measureMode==="rect"){

    pixels =
        Math.abs(
            measureEnd.x-measureStart.x
        );

}


    document.getElementById(
    "measurePixels")
    .innerText=
    pixels.toFixed(2);

    const actual =
    pixels *
    scaleUmPerPixel;

    let display;

    if(actual>=1000){

        display=
        (actual/1000)
        .toFixed(4)
        +" mm";
    }
    else{

        display=
        actual.toFixed(2)
        +" µm";
    }

    document.getElementById(
    "actualLength")
    .innerText=
    display;
}

/* =========================================
    DRAG & DROP
========================================= */

function setupDrop(
    dropZoneId,
    inputId,
    loadFunc
){

    const dropZone =
        document.getElementById(dropZoneId);

    const fileInput =
        document.getElementById(inputId);

    fileInput.onchange = () => {

        if(fileInput.files.length){

            loadFunc(
                fileInput.files[0]
            );

        }

    };

    dropZone.addEventListener(
        "dragover",
        function(e){

            e.preventDefault();

            dropZone.classList.add(
                "dragover"
            );

        }
    );

    dropZone.addEventListener(
        "dragleave",
        function(){

            dropZone.classList.remove(
                "dragover"
            );

        }
    );

    dropZone.addEventListener(
        "drop",
        function(e){

            e.preventDefault();

            dropZone.classList.remove(
                "dragover"
            );

            const file =
                e.dataTransfer.files[0];

            if(file){

                loadFunc(file);

            }

        }
    );

}

setupDrop(
"calibDrop",
"calibFile",
loadCalibrationImage
);

setupDrop(
"measureDrop",
"measureFile",
loadMeasureImage
);

updateMeasurementState();

document.getElementById("clearCalibBtn")
.addEventListener("click", function(){

    calibImg.src = "";

    calibStart = null;
    calibEnd = null;

    calibCtx.clearRect(
        0,
        0,
        calibCanvas.width,
        calibCanvas.height
    );

    document.getElementById(
        "calibFile"
    ).value = "";

    document.getElementById(
        "calibPixels"
    ).innerText = "0";

    document.getElementById(
        "scaleValue"
    ).innerText = "Not Calculated";

    document.querySelector(
        "#calibDrop .drop-text"
    ).style.display = "block";

    document.querySelector(
        "#calibDrop .drop-text"
    ).innerHTML =
    "Drop Calibration Image Here<br>or Drag Image Here";

    scaleUmPerPixel = 0;

    updateMeasurementState();

});

document.getElementById("lineBtn")
.addEventListener("click", function(){

    measureMode = "line";

});

document.getElementById("circleBtn")
.addEventListener("click", function(){

    measureMode = "circle";

});

document.getElementById("rectBtn")
.addEventListener("click", function(){

    measureMode = "rect";

});

document.getElementById("editBtn")
.addEventListener("click", function(){

    editMode = !editMode;

    alert(
        editMode
        ? "Edit Mode ON"
        : "Edit Mode OFF"
    );

});
document.getElementById("clearMeasureBtn")
.addEventListener("click", function(){

    measureImg.src = "";

    measureStart = null;
    measureEnd = null;

    measureCtx.clearRect(
        0,
        0,
        measureCanvas.width,
        measureCanvas.height
    );

    document.getElementById(
        "measureFile"
    ).value = "";

    document.getElementById(
        "measurePixels"
    ).innerText = "0";

    document.getElementById(
        "actualLength"
    ).innerText = "0";

    document.querySelector(
        "#measureDrop .drop-text"
    ).style.display = "block";

    document.querySelector(
        "#measureDrop .drop-text"
    ).innerHTML =
    "Drop Measurement Image Here<br>or Drag Image Here";

});
document.getElementById("measureDrop")
.addEventListener("click", function(){

    if(!measureImg.src){

        document.getElementById(
            "measureFile"
        ).click();

    }

});
document.getElementById("calibDrop")
.addEventListener("click", function(){

    if(!calibImg.src){

        document.getElementById(
            "calibFile"
        ).click();

    }

});
</script>

</body>
</html>
